<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: without it every env(safe-area-inset-*) the phone
         shell pads with is 0. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Argell Nicolo Isip | Executive Virtual Assistant</title>
    <meta name="description" content="Executive Virtual Assistant providing dependable administrative, operations, client support, research, reporting, and QuickBooks support for growing businesses." />
    <meta name="author" content="Argell Nicolo Isip" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <!-- The browser bar takes the page colour (--cream per theme); the inline
         theme script below and lib/theme.ts keep it in step with the toggle.
         Literal hex here only because this runs before any stylesheet loads. -->
    <meta name="theme-color" content="#070B14" />
    <link rel="canonical" href="https://argell-portfolio.vercel.app/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

   
    <link rel="preload" as="image" href="/avatar.svg" fetchpriority="high" media="(min-width: 1100px)" />

    <!-- Open Graph / social share. og:image must be an absolute URL once you deploy. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Argell Nicolo Isip" />
<meta property="og:title" content="Argell Nicolo Isip | Executive Virtual Assistant" />
<meta property="og:description" content="Executive Virtual Assistant providing dependable administrative, operations, client support, research, reporting, and QuickBooks support for growing businesses." />
    
   
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Keep the portfolio dark before first paint, regardless of saved preferences. -->
    <script>
      (function () {
        document.documentElement.dataset.theme = 'dark';
        if (document.documentElement.dataset.theme === 'dark') {
          var bar = document.querySelector('meta[name="theme-color"]');
          if (bar) bar.setAttribute('content', '#070B14');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
